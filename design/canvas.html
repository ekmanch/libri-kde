<title>Libri Desktop Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<!--
  Libri Desktop Mockup - Play
  A play-only copy of the Libri desktop (Linux / KDE, Rust + iced) design canvas, for clicking
  through and as a build reference. Nothing here is editable; the editable canvas lives in claude.ai.

  How this file is organized (for anyone reading the source, including Claude Code):
  - Each screen is a <template data-file="NAME.dc.html"> near the end of this file. Inside it:
      <x-dc> ... </x-dc>   the screen's markup: one 1600 x 900 desktop window with a KDE-style
                            title bar, all inline styles. {{name}} holes, <sc-for list="{{items}}"
                            as="x"> loops and <sc-if value="{{flag}}"> conditions are filled from
                            renderVals().
      <script type="text/x-dc" data-dc-script data-props="...">
                            class Component extends DCLogic { renderVals() { ... } }
                            Mock data, theme tokens (graphite / neutral / mocha / light, accent),
                            and interactions. data-props lists the screen's settings and defaults.
  - Shared design tokens live in each screen's script (THEMES, TYPE_DARK / TYPE_LIGHT, COVERS,
    TAG_CATS). They are duplicated per screen on purpose so every template stands alone.
  - The META block holds the screen list, each screen's title and its design notes.
  - The small runtime below renders the templates with Preact. It is only for this viewer.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
/* Layout: screen list on the left, the phone in the middle, notes and settings on the right. Stacks on narrow screens. */
:root {
  --bg: #0F1012;
  --panel: #17191C;
  --raised: #1F2225;
  --line: #2A2D31;
  --fg: #EEF0F2;
  --muted: #A3A8AE;
  --accent: #F8B289;
  --on-accent: #17120E;
  --font-display: 'Figtree', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

.top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex-shrink: 0; }
.brand h1 { margin: 0; font: 800 18px/1.2 var(--font-display); letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { padding: 3px 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; }
.top .count { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.picker { display: none; }

.body { min-height: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr); }

.side { overflow-y: auto; border-right: 1px solid var(--line); padding: 8px 10px 32px; }
.side h2 { margin: 18px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.side button { width: 100%; display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; }
.side button:hover { background: var(--raised); }
.side button[aria-current="true"] { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.side .code { flex-shrink: 0; width: 34px; font: 500 12px/1.4 var(--font-mono); color: var(--accent); }
.side .name { min-width: 0; font-size: 14px; line-height: 1.35; }

.main { min-width: 0; overflow-y: auto; display: flex; flex-wrap: wrap; align-items: flex-start; }
.stage { flex: 1 1 640px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 16px 32px; }
.toolbar { width: 100%; max-width: 900px; display: flex; align-items: center; gap: 8px; }
.toolbar .title { flex: 1 1 auto; min-width: 0; text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
.tbtn:hover:not(:disabled) { border-color: var(--muted); }
.tbtn:disabled { opacity: 0.4; cursor: default; }

.phone-box { position: relative; flex-shrink: 0; }
.phone { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; border-radius: 12px; overflow: hidden; background: transparent; }
.phone-screen { width: 1600px; height: 900px; position: relative; overflow: hidden; }
.screen-error { padding: 24px; color: #FF8A8A; font-size: 14px; }

.info { flex: 0 1 320px; min-width: 0; box-sizing: border-box; padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 22px; }
.info h2 { margin: 0; font: 800 22px/1.2 var(--font-display); letter-spacing: -0.03em; text-wrap: balance; }
.info .file { margin-top: 6px; font: 400 12.5px/1.4 var(--font-mono); color: var(--muted); }
.info h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.note { margin: 0 0 10px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.empty { margin: 0; color: var(--muted); font-size: 14px; }
.tweak { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.tweak label { font-size: 13px; color: var(--muted); }
.tweak select, .tweak input[type="text"], .tweak input[type="number"] { height: 40px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); padding: 0 10px; max-width: 100%; }
.tweak input[type="color"] { width: 56px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 2px; }
.check { flex-direction: row; align-items: center; gap: 10px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); font-size: 14px; }
.boot-error { padding: 24px; color: var(--muted); }

@media (max-width: 1280px) {
  .info { flex: 1 1 100%; max-width: 640px; margin: 0 auto; padding-top: 0; }
}
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .top { flex-wrap: wrap; padding: 12px 16px; }
  .top .count { display: none; }
  .picker { display: block; flex: 1 1 100%; width: 100%; min-width: 0; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); padding: 0 10px; max-width: 100%; }
  .body { display: block; }
  .side { display: none; }
  .main { overflow: visible; }
  .stage { padding-inline: 16px; }
  .info { padding-inline: 16px; }
}
@keyframes ldr{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.phone-screen .scroll::-webkit-scrollbar{width:10px}
.phone-screen .scroll::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.3);border-radius:5px;border:3px solid transparent;background-clip:padding-box}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div style="position: relative; width: 1600px; height: 900px; box-sizing: border-box; border-radius: 12px; overflow: hidden; background: {{t.chrome}}; color: {{t.text}}; font-family: 'Figtree', sans-serif; display: flex; flex-direction: column; box-shadow: {{t.shadow}}">
<div style="flex-shrink: 0; height: 38px; display: flex; align-items: center; padding: 0 14px; gap: 10px; position: relative">
<svg width="18" height="13" viewBox="0 0 1400 1000" role="img" aria-label="Libri"><clipPath id="lgs"><rect width="1400" height="1000" rx="150"></rect></clipPath><g clip-path="url(#lgs)"><rect width="700" height="1000" fill="#F8B289"></rect><rect x="700" width="700" height="1000" fill="#EDEEF0"></rect></g><path d="M200 350a37 37 0 0 1 57-32l238 150a37 37 0 0 1 0 64L257 682a37 37 0 0 1-57-32z" fill="#232428"></path><rect x="862" y="262" width="376" height="76" rx="38" fill="#232428"></rect><rect x="862" y="462" width="376" height="76" rx="38" fill="#232428"></rect><rect x="862" y="662" width="276" height="76" rx="38" fill="#232428"></rect></svg>

<script type="text/x-dc" data-dc-script data-props="{&quot;bg&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;graphite&quot;,&quot;charcoal&quot;,&quot;mocha&quot;,&quot;light&quot;],&quot;default&quot;:&quot;graphite&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#F8B289&quot;,&quot;#FF7AB6&quot;,&quot;#A78BFA&quot;,&quot;#5AA9FF&quot;],&quot;default&quot;:&quot;#F8B289&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;firstRun&quot;,&quot;returning&quot;],&quot;default&quot;:&quot;returning&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900}}">
const THEMES = {
  graphite: { chrome: "#131416", content: "#1D1F22", raised: "#2A2D31", field: "#1D1F22", line: "#3A3E44", text: "#EEF0F2", sub: "#A3A8AE" },
  charcoal: { chrome: "#151515", content: "#1C1C1C", raised: "#272727", field: "#202020", line: "#2E2E2E", text: "#EDEDED", sub: "#A3A3A3" },
  mocha:    { chrome: "#181825", content: "#1E1E2E", raised: "#2B2C3E", field: "#232334", line: "#313244", text: "#CDD6F4", sub: "#A6ADC8" },
  light:    { chrome: "#F4F5F7", content: "#FFFFFF", raised: "#E9EBEE", field: "#FFFFFF", line: "#D5D9DE", text: "#17181B", sub: "#5B616B" }
};
function mixWhite(h, f) { const n = parseInt(String(h).slice(1), 16); const c = (v) => Math.round(v + (255 - v) * f).toString(16).padStart(2, "0"); return "#" + c((n >> 16) & 255) + c((n >> 8) & 255) + c(n & 255); }
function theme(props) {
  const key = props.bg ?? "graphite"; const light = key === "light";
  const t = Object.assign({}, THEMES[key] || THEMES.graphite);
  t.light = light;
  t.track = light ? "#E3E5E9" : mixWhite(t.content, 0.12);
  t.sel = light ? "#E9EBEE" : mixWhite(t.content, 0.14);
  t.shadow = light ? "0 0 0 1px rgba(20,22,28,0.14), 0 30px 80px rgba(20,22,28,0.18)" : "0 0 0 1px rgba(0,0,0,0.6), 0 30px 80px rgba(0,0,0,0.55)";
  t.card = light ? "0 1px 2px rgba(20,22,28,0.10), 0 6px 18px rgba(20,22,28,0.10)" : "none";
  return t;
}
class Component extends DCLogic {
  renderVals() {
    const t = theme(this.props);
    const first = (this.props.state ?? "returning") === "firstRun";
    return { t, accent: (this.props.bg === "mocha" && String(this.props.accent ?? "#F8B289").toUpperCase() === "#F8B289") ? "#FAB387" : (this.props.accent ?? "#F8B289"), winTitle: "Libri",
      status: first ? "Getting things ready…" : "Loading your library…",
      footer: first ? "Version 0.1.0" : "ekmanch/library · main · library.json" };
  }
}
</script>

</div>

<div style="display: flex; align-items: center; gap: 10px; padding-top: 4px">

<span style="font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.sub}}; padding-top: 4px">Categories</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{nt.cats}}" as="c" hint-placeholder-count="13"><button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 32px; padding: 0 13px; border-radius: 16px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{t.text}}; font-size: 13.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px"><span style="display: {{c.checkDisp}}; line-height: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{c.label}}</button></sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: {{t.text}}">{{nt.sentence}}</p>
<p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: {{t.sub}}">People can be in more than one people category (Authors, Directors, Actors), genres in more than one genre category. Picking a category of another kind starts over with it.</p>
<div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 6px">
<button onClick="{{nt.cancel}}" style="height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; font-size: 13.5px; cursor: pointer">Cancel</button>
<button onClick="{{nt.create}}" style="height: 36px; padding: 0 18px; border-radius: 8px; border: 0; background: {{accent}}; color: {{onAccent}}; font-size: 13.5px; font-weight: 600; cursor: pointer">Create tag</button>
</div>
</div>
</div>
</sc-if>

<div style="position: absolute; left: 0; right: 0; top: 38px; bottom: 0; z-index: 40; background: {{t.scrim}}; display: flex; align-items: center; justify-content: center">
<div role="alertdialog" aria-labelledby="tokTitle" aria-describedby="tokBody" style="width: 500px; box-sizing: border-box; border-radius: 14px; background: {{t.pop}}; border: 1px solid {{t.line}}; box-shadow: {{t.popShadow}}; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-start; gap: 14px">

<p id="tokBody" style="margin: 0; font-size: 14px; line-height: 1.55; color: {{t.text}}">The access token for <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">ekmanch/library</span> stops working on {{tok.date}}. After that, Libri can't sync until you add a new one.</p>

</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding-top: 8px">

<span style="font-size: 13px; color: {{t.sub}}">{{h.linked}}</span>

<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600; color: {{i.titleColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.title}}</span>

</span>
<sc-if value="{{i.inPlan}}" hint-placeholder-val="{{false}}"><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: {{selBg}}; color: {{t.text}}; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">In plan</span></sc-if>
<span style="font-size: 12px; color: {{t.sub}}; white-space: nowrap">{{i.kind}}</span>
<sc-if value="{{i.showAdd}}" hint-placeholder-val="{{false}}"><button aria-label="{{i.addLabel}}" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; border: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></sc-if>
</div>
</sc-for>
</section>
</sc-for>
</div>
</sc-if>
<sc-if value="{{showTimeline}}" hint-placeholder-val="{{false}}">

<div style="display: grid; grid-template-columns: 110px 22px minmax(0, 1fr); gap: 0 14px; min-height: 64px">

</div>
</div>
</sc-for>
</div>
</sc-if>
</div>

</div>

<sc-if value="{{dlgOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 38px 0 0 0; z-index: 40; background: {{scrim}}; display: flex; align-items: center; justify-content: center">

<div style="display: flex; align-items: center; padding: 18px 20px 6px">

<button onClick="{{closeDlg}}" aria-label="Close" style="margin-left: auto; width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: {{t.sub}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: {{t.text}}">Name</span><input value="{{dlg.name}}" placeholder="e.g. Halloween, Road trip Texas" style="height: 36px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.field}}; color: {{t.text}}; padding: 0 10px; font: 14px 'Figtree', sans-serif; outline: 0"></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: {{t.text}}">Year <span style="font-weight: 400; color: {{t.sub}}">(optional)</span></span><input value="{{dlg.year}}" placeholder="2027" style="height: 36px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.field}}; color: {{t.text}}; padding: 0 10px; font: 14px 'Figtree', sans-serif; outline: 0"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: {{t.text}}">Date range <span style="font-weight: 400; color: {{t.sub}}">(optional)</span></span>
<div style="display: flex; align-items: center; gap: 10px">
<label style="flex: 1 1 0; height: 36px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.field}}; display: flex; align-items: center; gap: 8px; padding: 0 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.sub}}" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Start date</span><input value="{{dlg.from}}" placeholder="Start" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: {{t.text}}; font: 14px 'Figtree', sans-serif"></label>
<span style="color: {{t.sub}}">–</span>
<label style="flex: 1 1 0; height: 36px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.field}}; display: flex; align-items: center; gap: 8px; padding: 0 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.sub}}" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">End date</span><input value="{{dlg.to}}" placeholder="End" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: {{t.text}}; font: 14px 'Figtree', sans-serif"></label>
</div>
<span style="font-size: 12.5px; line-height: 1.45; color: {{t.sub}}">Shown on the plan and its card. The plan becomes active on the start date.</span>
</div>
<sc-if value="{{dlg.isEdit}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: flex-start; gap: 14px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; font-weight: 600; color: {{t.text}}">Started</span><span style="font-size: 12.5px; line-height: 1.45; color: {{t.sub}}">{{dlg.stHelp}}</span></span>
<button onClick="{{dStToggle}}" role="switch" aria-checked="{{dlg.stOn}}" aria-label="Started" style="width: 36px; height: 20px; flex-shrink: 0; margin-top: 1px; border: 0; padding: 0; border-radius: 10px; background: {{dlg.stTrack}}; position: relative; cursor: pointer"><span style="position: absolute; top: 3px; left: {{dlg.stLeft}}; width: 14px; height: 14px; border-radius: 7px; background: {{dlg.stKnob}}"></span></button>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">

</div>

</div>
</sc-if>

      props.onclick = function (e) { e.preventDefault(); if (userClick) userClick(e); go(target); };
    }
    return h.apply(null, [tag, props].concat(buildList(node.childNodes, scopes)));
  }

  function DCLogic(props, context) { Component.call(this, props, context); }
  DCLogic.prototype = Object.create(Component.prototype);
  DCLogic.prototype.constructor = DCLogic;
  DCLogic.prototype.render = function () {
    var vals = typeof this.renderVals === 'function' ? (this.renderVals() || {}) : {};
    return h(Fragment, null, buildList(this.__roots, [vals]));
  };

  function Boundary(props) { Component.call(this, props); this.state = {}; }
  Boundary.prototype = Object.create(Component.prototype);
  Boundary.prototype.constructor = Boundary;
  Boundary.prototype.componentDidCatch = function (err) { this.setState({ err: String((err && err.message) || err) }); };
  Boundary.prototype.render = function () {
    return this.state.err ? h('p', { 'class': 'screen-error' }, 'This screen failed to render: ' + this.state.err) : this.props.children;
  };

  function scopeCss(css) {
    return css.replace(/([^{}]+)\{([^{}]*)\}/g, function (m, sel, body) {
      sel = sel.trim();
      if (sel.charAt(0) === '@') return m;
      var parts = sel.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s && !/^(html|body)\b/.test(s); });
      return parts.length ? parts.map(function (s) { return '.phone-screen ' + s; }).join(',') + '{' + body + '}' : '';
    });
  }

  var compiled = {};
  function compile(file) {
    if (compiled[file]) return compiled[file];
    var tpl = null, all = document.querySelectorAll('template[data-file]');
    for (var i = 0; i < all.length; i++) if (all[i].getAttribute('data-file') === file) { tpl = all[i]; break; }
    if (!tpl) return null;
    var frag = tpl.content, xdc = frag.querySelector('x-dc');
    var helmet = xdc.querySelector('helmet'), css = '';
    if (helmet) helmet.querySelectorAll('style').forEach(function (s) { css += s.textContent; });
    var roots = Array.prototype.filter.call(xdc.childNodes, function (n) { return n !== helmet; });
    var script = frag.querySelector('script[data-dc-script]'), defs = {};
    try { defs = JSON.parse(script.getAttribute('data-props') || '{}'); } catch (e) { defs = {}; }
    var Comp = new Function('DCLogic', script.textContent + '\n;return Component;')(DCLogic);
    Comp.prototype.__roots = roots;
    return (compiled[file] = { file: file, css: scopeCss(css), defs: defs, Comp: Comp });
  }

  // ---- Viewer -------------------------------------------------------------
  var screenEl = document.getElementById('screen'), cssEl = document.getElementById('screen-css');
  var current = null, backStack = [], mountKey = 0, overrides = {};

  function splitTitle(t) {
    var i = t.indexOf(' · ');
    return i > 0 ? { code: t.slice(0, i), name: t.slice(i + 3) } : { code: '', name: t };
  }
  function propsFor(s) {
    var p = {}, o = overrides[s.file] || {};
    Object.keys(s.defs).forEach(function (k) { if (k.charAt(0) !== '$' && s.defs[k] && 'default' in s.defs[k]) p[k] = s.defs[k]['default']; });
    Object.keys(o).forEach(function (k) { p[k] = o[k]; });
    return p;
  }
  function mount() {
    var s = compile(current);
    cssEl.textContent = s.css;
    renderTo(h(Boundary, { key: current + ':' + mountKey }, h(s.Comp, propsFor(s))), screenEl);
  }
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }
  function go(file, opts) {
    opts = opts || {};
    if (!META.screens[file] || !compile(file)) { toast('That screen is not part of this mockup.'); return; }
    if (current && !opts.noPush && file !== current) backStack.push(current);
    if (file !== current) mountKey++;
    current = file;
    mount();
    updateChrome();
    try { history.replaceState(null, '', '#' + file); } catch (e) {}
  }

  var side = document.getElementById('side'), picker = document.getElementById('picker');
  META.sections.forEach(function (sec) {
    var hd = document.createElement('h2'); hd.textContent = sec.name; side.appendChild(hd);
    var group = document.createElement('optgroup'); group.label = sec.name;
    sec.files.forEach(function (f) {
      var parts = splitTitle(META.screens[f].title);
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-file', f);
      b.innerHTML = '<span class="code"></span><span class="name"></span>';
      b.firstChild.textContent = parts.code; b.lastChild.textContent = parts.name;
      b.addEventListener('click', function () { go(f); });
      side.appendChild(b);
      var o = document.createElement('option'); o.value = f; o.textContent = META.screens[f].title; group.appendChild(o);
    });
    picker.appendChild(group);
  });
  picker.addEventListener('change', function () { go(picker.value); });
  document.getElementById('count').textContent = Object.keys(META.screens).length + ' screens';
  document.getElementById('back').addEventListener('click', function () { if (backStack.length) go(backStack.pop(), { noPush: true }); });
  document.getElementById('restart').addEventListener('click', function () { mountKey++; mount(); });

  function updateChrome() {
    var meta = META.screens[current], s = compile(current);
    side.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-current', b.getAttribute('data-file') === current ? 'true' : 'false'); });
    var active = side.querySelector('button[aria-current="true"]');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
    picker.value = current;
    document.getElementById('back').disabled = !backStack.length;
    document.getElementById('crumb').textContent = meta.title;

    var info = document.getElementById('info');
    info.innerHTML = '';
    var head = document.createElement('div');
    var h2 = document.createElement('h2'); h2.textContent = meta.title; head.appendChild(h2);
    var fl = document.createElement('div'); fl.className = 'file'; fl.textContent = current; head.appendChild(fl);
    info.appendChild(head);

    var notesBox = document.createElement('div');
    var nh = document.createElement('h3'); nh.textContent = 'Design notes'; notesBox.appendChild(nh);
    if (meta.notes.length) meta.notes.forEach(function (n) { var p = document.createElement('p'); p.className = 'note'; p.textContent = n; notesBox.appendChild(p); });
    else { var e = document.createElement('p'); e.className = 'empty'; e.textContent = 'No notes on this screen.'; notesBox.appendChild(e); }
    info.appendChild(notesBox);

    var keys = Object.keys(s.defs).filter(function (k) { var d = s.defs[k]; return k.charAt(0) !== '$' && d && d.editor; });
    var tw = document.createElement('div');
    var th = document.createElement('h3'); th.textContent = 'Screen settings'; tw.appendChild(th);
    if (!keys.length) { var none = document.createElement('p'); none.className = 'empty'; none.textContent = 'This screen has no settings.'; tw.appendChild(none); }
    var vals = propsFor(s);
    keys.forEach(function (k) {
      var d = s.defs[k], id = 'tw-' + k, row = document.createElement('div'), lab = document.createElement('label'), input;
      row.className = 'tweak'; lab.setAttribute('for', id); lab.textContent = k;
      if (d.editor === 'enum') {
        input = document.createElement('select');
        (d.options || []).forEach(function (op) { var o = document.createElement('option'); o.value = op; o.textContent = op; input.appendChild(o); });
        input.value = vals[k];
      } else if (d.editor === 'boolean') {
        input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!vals[k]; row.className = 'tweak check';
      } else if (d.editor === 'color') {
        input = document.createElement('input'); input.type = 'color'; input.value = vals[k] || '#000000';
      } else if (d.editor === 'int' || d.editor === 'float' || d.editor === 'range') {
        input = document.createElement('input'); input.type = 'number'; input.value = vals[k];
      } else {
        input = document.createElement('input'); input.type = 'text'; input.value = vals[k] == null ? '' : vals[k];
      }
      input.id = id;
      input.addEventListener(d.editor === 'text' ? 'input' : 'change', function () {
        var v = d.editor === 'boolean' ? input.checked : (d.editor === 'int' || d.editor === 'float' || d.editor === 'range') ? Number(input.value) : input.value;
        (overrides[current] = overrides[current] || {})[k] = v;
        mountKey++; mount();
      });
      if (d.editor === 'boolean') { row.appendChild(input); row.appendChild(lab); } else { row.appendChild(lab); row.appendChild(input); }
      tw.appendChild(row);
    });
    if (keys.length) { var hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = 'Changing a setting restarts the screen.'; tw.appendChild(hint); }
    info.appendChild(tw);
  }

  var box = document.getElementById('phoneBox'), phone = document.getElementById('phone'), stage = document.querySelector('.stage');
  function fit() {
    var narrow = window.matchMedia('(max-width: 760px)').matches;
    var availW = stage.clientWidth - 32;
    var availH = narrow ? Infinity : window.innerHeight - document.querySelector('.top').offsetHeight - 100;
    var sc = Math.max(0.2, Math.min(1, availW / 1600, availH / 900));
    phone.style.transform = 'scale(' + sc + ')';
    box.style.width = Math.round(1600 * sc) + 'px';
    box.style.height = Math.round(900 * sc) + 'px';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  fit();

  var start = decodeURIComponent((location.hash || '').slice(1));
  go(META.screens[start] ? start : (META.screens['Main.dc.html'] ? 'Main.dc.html' : META.sections[0].files[0]), { noPush: true });
})();
</script>
