[package]
name = "libri"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "image", "tokio", "advanced"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# KWin's title bar in Libri's colors (src/decoration.rs): the window's raw
# Wayland handles, the connection and Plasma's decoration palette protocol.
# All three are already in the build through winit.
raw-window-handle = "0.6.2"
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
iced_test = "0.14.0"
