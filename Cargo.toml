[package]
name = "libri"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "image", "tokio", "advanced"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# KWin's title bar in Libri's colors (src/decoration.rs): the window's raw
# Wayland handles, the connection and Plasma's decoration palette protocol.
# All three are already in the build through winit.
raw-window-handle = "0.6.2"
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
# The freeze trace (src/trace.rs) catches iced's, winit's and wgpu's
# warnings; already in the build through all three.
log = "0.4.29"
# GitHub's REST API (src/github): a small blocking client, run on tokio's
# blocking pool from an iced Task. rustls through its default features.
ureq = "3.4"
# The git blob sha of the library file (SHA-1 of "blob <len>\0" and the
# bytes), which the Contents API wants and the three-way sync compares.
sha1 = "0.11"
# Already in the build: base64 for the Contents API's content, tokio for
# the blocking pool and the timers (iced's runtime), zbus for KDE Wallet.
base64 = "0.22"
tokio = "1"
zbus = "5.19"

[dev-dependencies]
iced_test = "0.14.0"

# iced_wgpu 0.14.0 with one change in `window/compositor.rs`, backported
# from iced master: the surface format is never one with a 2-bit alpha.
# NVIDIA's Wayland driver lists 10-bit formats first, iced 0.14 takes the
# first non-sRGB one with its default `web-colors` blending, and a 2-bit
# alpha rounds every see-through surface of Glass to thirds (docs/DESIGN.md
# section 10, Glass). The next iced release carries the fix; this patch
# only matches iced_wgpu 0.14.0, so after the upgrade Cargo warns that it is
# unused, and the folder and these lines go.
[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }
