[package]
name = "libri"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "image", "tokio", "advanced"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# KWin's title bar in Libri's colors (src/decoration.rs): the window's raw
# Wayland handles, the connection and Plasma's decoration palette protocol.
# All three are already in the build through winit.
raw-window-handle = "0.6.2"
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
# The freeze trace (src/trace.rs) catches iced's, winit's and wgpu's
# warnings; already in the build through all three.
log = "0.4.29"

[dev-dependencies]
iced_test = "0.14.0"

# iced_wgpu 0.14.0 with one change in `window/compositor.rs`: the surface
# format is never one with fewer than 8 bits of alpha. NVIDIA's Wayland
# driver lists 10-bit formats first, iced takes the first non-sRGB one with
# its default `web-colors` blending, and a 2-bit alpha rounds every
# see-through surface of Glass to thirds (docs/DESIGN.md section 10, Glass).
# Drop the copy once iced carries the fix.
[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }
